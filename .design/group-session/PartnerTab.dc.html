<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;}
a{color:#176b45;}a:hover{color:#0f4d31;}
</style>
</helmet>
<div style="width:390px;min-height:900px;background:#f5f4ed;color:#17211b;padding:18px;display:flex;flex-direction:column;gap:14px">

  <div style="background:#fff;border:1px solid #dfe3dc;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px">

    <div style="display:flex;gap:0;border-bottom:1px solid #dfe3dc">
      <div style="flex-grow:1;display:flex;flex-direction:column;gap:6px;align-items:center;padding:12px 0">
        <span style="font-weight:700;font-size:15px;color:#67736b">王小明</span>
        <span style="font-size:11px;color:#67736b;font-weight:700">3 個動作 · 8 組</span>
      </div>
      <div style="flex-grow:1;display:flex;flex-direction:column;gap:6px;align-items:center;padding:12px 0;border-bottom:3px solid #7e4f2a;margin-bottom:-1px">
        <span style="font-weight:900;font-size:15px;color:#7e4f2a">李小美</span>
        <span style="font-size:11px;color:#67736b;font-weight:700">2 個動作 · 6 組</span>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;background:#f2ece5;border:1px solid #d9c9b8;border-radius:12px;padding:12px 14px">
      <span style="width:32px;height:32px;border-radius:50%;background:#7e4f2a;color:#fff;font-size:14px;font-weight:900;display:grid;place-items:center">李</span>
      <span style="flex-grow:1;font-size:13px;font-weight:700">正在填李小美的重量</span>
      <span style="font-size:12px;color:#67736b">動作與時間共用</span>
    </div>

    <div style="border:1px solid #dfe3dc;border-radius:14px;padding:16px;background:#fafbf8;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;gap:10px;align-items:center">
        <div style="flex-grow:1;border:1px solid #dfe3dc;border-radius:10px;padding:11px 12px;background:#fff;font-size:15px;font-weight:700">槓鈴深蹲</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;background:#e7f2eb;border:1px solid #bcd6c5;border-radius:8px;padding:8px 10px">
        <span style="font-size:12px;color:#67736b;font-weight:800">王小明剛才</span>
        <span style="font-size:12px;font-weight:700">60 kg × 10 · 65 kg × 10</span>
      </div>
      <div style="display:grid;grid-template-columns:28px 1fr 1fr 65px 28px;gap:8px;align-items:center;font-size:12px;color:#67736b;font-weight:800">
        <span>組</span><span>次數</span><span>重量</span><span>單位</span><span></span>
      </div>
      <div style="display:grid;grid-template-columns:28px 1fr 1fr 65px 28px;gap:8px;align-items:center">
        <span style="font-size:13px;font-weight:800;color:#67736b">1</span>
        <div style="border:1px solid #dfe3dc;border-radius:10px;padding:9px;background:#fff;font-size:15px">12</div>
        <div style="border:1px solid #7e4f2a;border-radius:10px;padding:9px;background:#fff;font-size:15px;font-weight:700">30</div>
        <div style="border:1px solid #dfe3dc;border-radius:10px;padding:9px;background:#fff;font-size:14px">kg</div>
        <span style="color:#a33;text-align:center;font-size:15px">✕</span>
      </div>
      <div style="display:grid;grid-template-columns:28px 1fr 1fr 65px 28px;gap:8px;align-items:center">
        <span style="font-size:13px;font-weight:800;color:#67736b">2</span>
        <div style="border:1px solid #dfe3dc;border-radius:10px;padding:9px;background:#fff;font-size:15px">12</div>
        <div style="border:1px solid #dfe3dc;border-radius:10px;padding:9px;background:#fff;font-size:15px">32.5</div>
        <div style="border:1px solid #dfe3dc;border-radius:10px;padding:9px;background:#fff;font-size:14px">kg</div>
        <span style="color:#a33;text-align:center;font-size:15px">✕</span>
      </div>
      <div style="display:flex;gap:8px">
        <span style="background:#17211b;color:#fff;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700">＋ 新增一組</span>
        <span style="background:#fff;color:#17211b;border:1px solid #dfe3dc;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700">沿用第一組重量</span>
      </div>
    </div>

    <div style="border:1px solid #dfe3dc;border-radius:14px;padding:16px;background:#fafbf8;display:flex;flex-direction:column;gap:12px;position:relative">
      <div style="display:flex;gap:10px;align-items:center">
        <div style="flex-grow:1;border:1px solid #dfe3dc;border-radius:10px;padding:11px 12px;background:#fff;font-size:15px;font-weight:700">滑輪下拉</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <span style="font-size:11px;color:#67736b;font-weight:800">誰做這個動作</span>
        <span style="background:#fff;border:1px solid #dfe3dc;color:#67736b;border-radius:16px;padding:6px 10px;font-size:12px;font-weight:700">王</span>
        <span style="display:flex;align-items:center;gap:5px;background:#7e4f2a;color:#fff;border-radius:16px;padding:6px 10px;font-size:12px;font-weight:700">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.4l2.6 2.6L10 3"/></svg>李
        </span>
      </div>
      <div style="background:#17211b;color:#fff;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px">
        <div style="font-size:12px;font-weight:800;color:#dff46c;letter-spacing:1px">點一下切換參與者</div>
        <div style="font-size:13px;line-height:1.6">動作只會存進有勾選的學生紀錄裡，兩人各自的重量互不影響。</div>
      </div>
    </div>

    <div style="border:1px dashed #b6c0b4;border-radius:14px;padding:14px;text-align:center;color:#17211b;font-weight:700;font-size:14px">＋ 新增動作</div>

    <label style="display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px">李小美的備註
      <div style="border:1px solid #dfe3dc;border-radius:10px;padding:12px 14px;font-weight:400;font-size:15px;color:#67736b;min-height:64px">左膝仍不適，深蹲降重量</div>
    </label>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="color:#67736b;font-size:12px;text-align:center">將建立 2 筆紀錄：王小明 3 動作、李小美 2 動作</div>
    <div style="background:#17211b;color:#fff;border-radius:12px;padding:16px;text-align:center;font-weight:700;font-size:16px">儲存兩人紀錄</div>
  </div>

</div>
</x-dc>
</body>
</html>
