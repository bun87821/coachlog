<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;}
a{color:#176b45;}a:hover{color:#0f4d31;}
</style>
</helmet>
<div style="width:390px;min-height:760px;background:#f5f4ed;color:#17211b;padding:18px;display:flex;flex-direction:column;gap:14px">

  <div style="display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;flex-direction:column;gap:5px">
      <div style="color:#176b45;font-weight:800;letter-spacing:2px;font-size:11px">課程歷史</div>
      <div style="font-size:22px;font-weight:900;letter-spacing:-0.5px">過去訓練紀錄</div>
    </div>
    <span style="color:#67736b;font-size:13px">共 24 堂</span>
  </div>

  <div style="background:#fff;border:1px solid #dfe3dc;border-left:5px solid #176b45;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:7px">
      <span style="align-self:flex-start;background:#dff46c;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:900">最新紀錄</span>
      <strong style="font-size:17px">2026年8月24日</strong>
      <span style="color:#67736b;font-size:13px">19:00 · 3 個動作 · 8 組</span>
      <div style="display:flex;align-items:center;gap:8px;align-self:flex-start;background:#f2ece5;border:1px solid #d9c9b8;border-radius:20px;padding:6px 12px 6px 6px">
        <span style="width:24px;height:24px;border-radius:50%;background:#7e4f2a;color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center">李</span>
        <span style="font-size:12px;font-weight:700">與 李小美 一起上課</span>
      </div>
    </div>
    <div style="background:#f5f4ed;padding:10px 12px;border-radius:8px;font-size:14px">深蹲下降速度再放慢</div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div style="border-bottom:1px solid #dfe3dc;padding-bottom:12px;display:flex;flex-direction:column;gap:8px">
        <h3 style="margin:0;font-size:16px">槓鈴深蹲</h3>
        <div style="display:flex;flex-wrap:wrap;gap:7px">
          <span style="background:#e7f2eb;padding:7px 10px;border-radius:8px;font-size:13px">第 1 組　<strong>60 kg</strong> × 10</span>
          <span style="background:#e7f2eb;padding:7px 10px;border-radius:8px;font-size:13px">第 2 組　<strong>65 kg</strong> × 10</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <h3 style="margin:0;font-size:16px">引體向上</h3>
        <div style="display:flex;flex-wrap:wrap;gap:7px">
          <span style="background:#e7f2eb;padding:7px 10px;border-radius:8px;font-size:13px">第 1 組　<strong>— kg</strong> × 8</span>
          <span style="background:#e7f2eb;padding:7px 10px;border-radius:8px;font-size:13px">第 2 組　<strong>— kg</strong> × 6</span>
        </div>
      </div>
    </div>
    <div style="color:#67736b;font-size:14px;font-weight:700;border-top:1px solid #dfe3dc;padding-top:12px">修改這堂課</div>
  </div>

  <div style="background:#fff;border:1px solid #dfe3dc;border-left:5px solid #dfe3dc;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:7px">
      <strong style="font-size:17px">2026年8月21日</strong>
      <span style="color:#67736b;font-size:13px">18:30 · 2 個動作 · 6 組 · 單人課</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <h3 style="margin:0;font-size:16px">硬舉</h3>
      <div style="display:flex;flex-wrap:wrap;gap:7px">
        <span style="background:#e7f2eb;padding:7px 10px;border-radius:8px;font-size:13px">第 1 組　<strong>80 kg</strong> × 5</span>
        <span style="background:#e7f2eb;padding:7px 10px;border-radius:8px;font-size:13px">第 2 組　<strong>85 kg</strong> × 5</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
